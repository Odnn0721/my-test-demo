<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="tabs/tab2" text="后退"></ion-back-button>
    </ion-buttons>
    <ion-title>【b03】双向绑定</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <label>姓名：</label>
  <input [(ngModel)]="xm" (ngModelChange)="showResult()" placeholder="请输入姓名">
  <br>
  <p>你参加的项目是（必须选一项）：</p>
  <div>
    <input type="radio" name="g1" value="篮球" checked [(ngModel)]="r" (ngModelChange)="showResult()">
    <label>篮球</label>
    <input style="margin-left:10px;" type="radio" name="g1" value="排球" [(ngModel)]="r" (ngModelChange)="showResult()">
    <label>排球</label>
  </div>
  <br>
  <div [innerHTML]="result"></div>
  <div id='container'>
    <div id='mydiv'></div>
  </div>
</ion-content>
