<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>BaiduMap</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <button (click)="showPage1()">D01-基本地图与控件</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage2()">D02-覆盖物</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage3()">D03-信息窗口</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage4()">D04-标注</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage5()">D05-地址解析</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage6()">D06-定位</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage7()">D07-公交查询与位置检索</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage8()">D08-路线规划与距离计算</button>
    </ion-item>
    <ion-item>
      <button (click)="showPage9()">D09-GPS导航</button>
    </ion-item>
  </ion-list>
</ion-content>
